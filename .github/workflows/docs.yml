name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Version shown on the site: the latest release tag.
      - run: echo "DOCS_VERSION=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)" >> "$GITHUB_ENV"
      # The site is served under https://navettejs.github.io/navette/: every absolute link gets this prefix.
      - run: node apps/docs/build.ts
        env:
          DOCS_BASE: /navette
          DOCS_OUT: ${{ github.workspace }}/_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
